services:
  - type: web
    name: ecommerce-store
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/var/data/ecommerce.db
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
      - key: Admin__FullName
        value: Store Administrator
    disk:
      name: ecommerce-data
      mountPath: /var/data
      sizeGB: 1
