services:
  - type: web
    name: ecommerce-store
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/var/data/ecommerce.db
    disk:
      name: ecommerce-data
      mountPath: /var/data
      sizeGB: 1
